# Copies s3://models/p1546-risk/v1 (the OpenShift AI data connection, source of truth) onto the model PVC that the
# InferenceService mounts. Credentials only via envFrom; nothing is printed except object names and sizes.
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-p1546-model
  labels: {sinceai: "2026"}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      volumes: [{name: models, persistentVolumeClaim: {claimName: p1546-models}}]
      containers:
        - name: stage
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2025.2
          envFrom: [{secretRef: {name: models-connection}}]
          volumeMounts: [{name: models, mountPath: /pvc}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          command:
            - python
            - -c
            - |
              import os, boto3
              s3 = boto3.client("s3", endpoint_url=os.environ["AWS_S3_ENDPOINT"], region_name=os.environ.get("AWS_DEFAULT_REGION") or "us-east-1",
                                aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"])
              bucket, prefix, dest = os.environ["AWS_S3_BUCKET"], "p1546-risk/v1/", "/pvc/p1546-risk/v1/"
              os.makedirs(dest, exist_ok=True)
              for o in s3.list_objects_v2(Bucket=bucket, Prefix=prefix)["Contents"]:
                  name = o["Key"][len(prefix):]
                  if name:
                      s3.download_file(bucket, o["Key"], dest + name)
                      print(name, os.path.getsize(dest + name))
