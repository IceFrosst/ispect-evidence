# One-off: copy the model files trained during the image build into s3://models/p1546-risk/v1 (MinIO), inside the
# cluster. Credentials come from the data connection via envFrom; they are never printed or leave the cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-p1546-model
  labels: {sinceai: "2026"}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      volumes: [{name: m, emptyDir: {}}]
      initContainers:
        - name: copy-from-image
          image: image-registry.openshift-image-registry.svc:5000/danialheidari619-dev/p1546-risk:latest
          command: ["sh", "-c", "cp data/risk/p1546_q*.txt /m/ && cp risk/metrics.json /m/ && ls -l /m"]
          volumeMounts: [{name: m, mountPath: /m}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 256Mi}}
      containers:
        - name: upload
          # the OpenShift AI "Standard Data Science" workbench image (in-cluster, has boto3); no outside image needed
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2025.2
          envFrom: [{secretRef: {name: models-connection}}]
          command:
            - python
            - -c
            - |
              import os, glob, boto3
              s3 = boto3.client("s3", endpoint_url=os.environ["AWS_S3_ENDPOINT"], region_name=os.environ.get("AWS_DEFAULT_REGION") or "us-east-1",
                                aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"])
              bucket = os.environ["AWS_S3_BUCKET"]
              if bucket not in [b["Name"] for b in s3.list_buckets()["Buckets"]]:
                  s3.create_bucket(Bucket=bucket)
              for f in sorted(glob.glob("/m/*")):
                  s3.upload_file(f, bucket, "p1546-risk/v1/" + os.path.basename(f))
              for o in s3.list_objects_v2(Bucket=bucket, Prefix="p1546-risk/v1/")["Contents"]:
                  print(o["Key"], o["Size"])
          volumeMounts: [{name: m, mountPath: /m}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 256Mi}}
